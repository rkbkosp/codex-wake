name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: E2E fail-once gate
        run: |
          echo "Intentional first-revision failure for the Codex Wake acceptance test."
          exit 1

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...
